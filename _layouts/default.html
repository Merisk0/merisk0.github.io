<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0e1510">
  <link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v=7">
  <link rel="stylesheet" href="{{ '/Articles/Articles.css' | relative_url }}?v=7">
  <script src="{{ '/theme.js' | relative_url }}?v=7"></script>
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<nav class="nav">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <div class="navlinks">
    <a href="{{ '/#articles' | relative_url }}">文章</a>
    <a href="{{ '/archive.html' | relative_url }}">归档</a>
    <a href="{{ '/tags.html' | relative_url }}">标签</a>
    <a href="{{ '/AboutMe.html' | relative_url }}">关于我</a>
    <a href="{{ '/status.html' | relative_url }}">状态</a>
    <a href="{{ '/pages.html' | relative_url }}">更多</a>
    <a href="{{ '/#contact' | relative_url }}">联系</a>
    <button class="theme-btn" data-theme-toggle onclick="toggleTheme()" aria-label="切换主题">☾</button>
  </div>
</nav>
{{ content }}
<footer>
  <div class="footer-links">
    <a href="{{ '/AboutMe.html' | relative_url }}">关于我</a>
    <a href="{{ '/archive.html' | relative_url }}">归档</a>
    <a href="{{ '/#articles' | relative_url }}">文章</a>
    <a href="https://space.bilibili.com/372356105" target="_blank" rel="noopener">Bilibili</a>
  </div>
  <div>Copyright © Merisk &amp; Arrowa · 2020–2026</div>
</footer>
</body>
</html>
