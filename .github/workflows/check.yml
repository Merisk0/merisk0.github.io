name: Build and check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Verify generated files
        run: |
          test -f dist/index.html
          test -f dist/archive.html
          test -f dist/tags.html
          test -f dist/status.html
          test -f dist/search.json
          test -f dist/sitemap.xml
          test -f dist/feed.xml
          test -f dist/Articles/1.html
          test -f dist/Articles/auto-generated-article.html
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --exclude 'giscus.app' 'dist/**/*.html'
          fail: false
