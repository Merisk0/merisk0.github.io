name: Build and check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Install Jekyll
        run: |
          gem install bundler
          gem install jekyll jekyll-seo-tag jekyll-sitemap jekyll-feed
      - name: Build site
        run: jekyll build
      - name: Verify generated files
        run: |
          test -f _site/index.html
          test -f _site/archive.html
          test -f _site/tags.html
          test -f _site/status.html
          test -f _site/search.json
          test -f _site/sitemap.xml
          test -f _site/feed.xml
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --exclude 'giscus.app' '_site/**/*.html'
          fail: false
